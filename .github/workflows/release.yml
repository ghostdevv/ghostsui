name: Release Package

on:
    push:
        branches:
            - main

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        if: github.repository == 'ghostdevv/ghostsui'
        permissions:
            id-token: write
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # This makes Actions fetch all Git history so that Changesets
                  # can generate changelogs with the correct commits.
                  fetch-depth: 0

            - name: Setup PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Create Release Pull Request
              uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
              with:
                  publish-script: pnpm changeset publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
